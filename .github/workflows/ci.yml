name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  state_fence:
    name: state_fence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Get dependencies
        working-directory: packages/state_fence
        run: dart pub get
      - name: Check formatting
        run: dart format --set-exit-if-changed packages/state_fence
      - name: Analyse
        working-directory: packages/state_fence
        run: dart analyze --fatal-infos
      - name: Run tests
        working-directory: packages/state_fence
        run: dart test
      - name: Run example
        working-directory: packages/state_fence
        run: dart run example/state_fence_example.dart
      - name: Check dartdoc
        working-directory: packages/state_fence
        run: dart doc --dry-run

  state_fence_flutter:
    name: state_fence_flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get dependencies
        working-directory: packages/state_fence_flutter
        run: flutter pub get
      - name: Check formatting
        run: dart format --set-exit-if-changed packages/state_fence_flutter
      - name: Analyse
        working-directory: packages/state_fence_flutter
        run: flutter analyze --fatal-infos
      - name: Run tests
        working-directory: packages/state_fence_flutter
        run: flutter test
      - name: Analyse example
        working-directory: packages/state_fence_flutter/example
        run: flutter analyze --fatal-infos
      - name: Test example
        working-directory: packages/state_fence_flutter/example
        run: flutter test

  state_fence_test:
    name: state_fence_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Get dependencies
        working-directory: packages/state_fence_test
        run: dart pub get
      - name: Check formatting
        run: dart format --set-exit-if-changed packages/state_fence_test
      - name: Analyse
        working-directory: packages/state_fence_test
        run: dart analyze --fatal-infos
      - name: Run tests
        working-directory: packages/state_fence_test
        run: dart test
      - name: Run example
        working-directory: packages/state_fence_test
        run: dart run example/state_fence_test_example.dart

  publish_readiness:
    name: publish readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # A published archive must resolve on its own. Any local path override
      # left in a pubspec.yaml would break dependency resolution once the
      # archive is extracted for pub.dev analysis, so fail the build early.
      - name: Reject path overrides in published pubspecs
        run: |
          for package in state_fence state_fence_flutter state_fence_test; do
            if grep -q 'dependency_overrides' "packages/$package/pubspec.yaml"; then
              echo "::error::packages/$package/pubspec.yaml declares dependency_overrides."
              echo "Move local path overrides into pubspec_overrides.yaml instead."
              exit 1
            fi
          done
      - name: Verify overrides are excluded from archives
        run: |
          for package in state_fence_flutter state_fence_test; do
            test -f "packages/$package/.pubignore" || {
              echo "::error::packages/$package/.pubignore is missing."
              exit 1
            }
            grep -q 'pubspec_overrides.yaml' "packages/$package/.pubignore" || {
              echo "::error::packages/$package/.pubignore must exclude pubspec_overrides.yaml."
              exit 1
            }
          done
      # The core archive must be publishable on its own. A listed
      # pubspec_overrides.yaml, including one under example/, fails the job.
      - name: Validate state_fence archive
        working-directory: packages/state_fence
        run: |
          set -euo pipefail
          dart pub get
          set +e
          output=$(dart pub publish --dry-run 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::dart pub publish --dry-run failed for state_fence (exit $status)."
            exit 1
          fi
          file_list=$(printf '%s\n' "$output" | sed -n '/^Publishing /,/^Total compressed archive size/p')
          if printf '%s\n' "$file_list" | grep -q 'pubspec_overrides.yaml'; then
            echo "::error::state_fence archive lists pubspec_overrides.yaml."
            exit 1
          fi
      - name: Check state_fence_test dartdoc
        working-directory: packages/state_fence_test
        run: |
          dart pub get
          dart doc --dry-run
          rm -rf doc
      - name: Check state_fence_flutter dartdoc
        working-directory: packages/state_fence_flutter
        run: |
          flutter pub get
          dart doc --dry-run
          rm -rf doc
      # Before state_fence is on pub.dev, resolving the hosted dependency
      # fails. That is the only acceptable non-zero dry run. Exit 0 is
      # required once the core package is published.
      - name: Validate dependent package archives
        run: |
          set -euo pipefail

          unresolved_core_only() {
            local output="$1"
            local resolution other
            resolution=$(printf '%s\n' "$output" | grep -E 'state_fence' | grep -E -i "could not find package|doesn't exist|does not exist|version solving failed|no versions|not exist" || true)
            if [ -z "$resolution" ]; then
              return 1
            fi
            # pub lists each package problem as a "* " bullet. A bullet that
            # does not mention state_fence is a different failure.
            other=$(printf '%s\n' "$output" | grep -E '^\* ' | grep -v -E 'state_fence' || true)
            if [ -n "$other" ]; then
              printf '%s\n' "$other"
              return 1
            fi
            return 0
          }

          check_package() {
            local package="$1"
            local tool="$2"
            local output status
            echo "::group::$package"
            (cd "packages/$package" && "$tool" pub get >/dev/null)
            set +e
            output=$(cd "packages/$package" && "$tool" pub publish --dry-run 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            file_list=$(printf '%s\n' "$output" | sed -n '/^Publishing /,/^Total compressed archive size/p')
            if printf '%s\n' "$file_list" | grep -q 'pubspec_overrides.yaml'; then
              echo "::error::$package would publish pubspec_overrides.yaml."
              echo "::endgroup::"
              exit 1
            fi
            if [ "$status" -eq 0 ]; then
              echo "$package dry run exited 0."
              echo "::endgroup::"
              return 0
            fi
            if unresolved_core_only "$output"; then
              echo "$package dry run failed only because hosted state_fence cannot be resolved."
              echo "::endgroup::"
              return 0
            fi
            echo "::error::$package dry run failed for a reason other than an unresolved hosted state_fence package (exit $status)."
            echo "::endgroup::"
            exit 1
          }

          check_package state_fence_flutter flutter
          check_package state_fence_test dart
