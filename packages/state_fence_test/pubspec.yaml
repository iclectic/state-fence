name: state_fence_test
description: >-
  Test utilities and matchers for the StateFence correctness toolkit.
  Provides fake clock support and scenario helpers for deterministic testing
  of state transitions and guarded operations.
version: 0.1.0

repository: https://github.com/iclectic/state-fence
issue_tracker: https://github.com/iclectic/state-fence/issues

topics:
  - state-management
  - testing
  - diagnostics
  - test-utilities
  - flutter

environment:
  sdk: ^3.0.0

dependencies:
  matcher: ^0.12.16
  state_fence: ^0.1.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0

# Resolve the sibling package from the local path during monorepo
# development. Consumers ignore dependency_overrides, and the hosted
# constraint above is what is used once the package is published.
dependency_overrides:
  state_fence:
    path: ../state_fence
