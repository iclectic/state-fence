name: state_fence_flutter
description: >-
  Flutter integration for state_fence. Provides lifecycle ownership for
  StateFence and GuardedOperation instances via StateFenceOwner and
  StateFenceStateMixin, plus a FlutterErrorReporter that forwards violations
  into Flutter's standard error reporting pipeline.
version: 0.1.0

repository: https://github.com/iclectic/state-fence
issue_tracker: https://github.com/iclectic/state-fence/issues

topics:
  - state-management
  - testing
  - diagnostics
  - flutter
  - lifecycle

environment:
  sdk: ^3.0.0
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  state_fence: ^0.1.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

# Resolve the sibling package from the local path during monorepo
# development. Consumers ignore dependency_overrides, and the hosted
# constraint above is what is used once the package is published.
dependency_overrides:
  state_fence:
    path: ../state_fence
