name: state_fence_flutter
description: >-
  Flutter integration for state_fence: lifecycle ownership for fences and
  guarded operations, plus a reporter that forwards violations to FlutterError.
version: 0.1.0

repository: https://github.com/iclectic/state-fence
issue_tracker: https://github.com/iclectic/state-fence/issues

topics:
  - state-management
  - testing
  - diagnostics
  - flutter
  - lifecycle

environment:
  sdk: ^3.0.0
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  state_fence: ^0.1.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
