name: state_fence_example
description: >-
  Example application demonstrating StateFence against three common Flutter
  state failures: stale search, duplicate submission and stuck loading.
publish_to: none

environment:
  sdk: ^3.0.0
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  state_fence:
    path: ../../state_fence
  state_fence_flutter:
    path: ../

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
