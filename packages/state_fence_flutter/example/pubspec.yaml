name: state_fence_example
description: >-
  Example application demonstrating StateFence against three common Flutter
  state failures: stale search, duplicate submission and stuck loading.
publish_to: none

environment:
  sdk: ^3.0.0
  # The demo UI uses Color.withValues and the surfaceContainer colour roles,
  # which require a newer Flutter than the library itself does. The published
  # packages keep the lower bound declared in their own pubspecs.
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  state_fence: ^0.1.0
  state_fence_flutter: ^0.1.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
