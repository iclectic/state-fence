name: state_fence
description: >-
  State-management-neutral correctness toolkit for Dart and Flutter. Detect
  illegal state transitions, stale asynchronous results, duplicate operations
  and lifecycle misuse. Provides typed transition contracts, guarded operations
  with latestWins and firstWins policies, a bounded diagnostic timeline with
  privacy-aware redaction, and injectable time and reporting for deterministic
  tests.
version: 0.1.0
publish_to: none

repository: https://github.com/iclectic/state-fence
issue_tracker: https://github.com/iclectic/state-fence/issues

topics:
  - state-management
  - testing
  - diagnostics
  - race-condition
  - flutter

environment:
  sdk: ^3.0.0

dependencies:
  meta: ^1.10.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
